<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Página Inicial{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">
    {% block estilos %}{% endblock %}
</head>

<body>
    <nav class="navbar shadow-sm" style="justify-content: space-between;">
        <div class="container">
            <img src="https://raw.githubusercontent.com/ricrett/app-bs/refs/heads/main/static/imgs/3738805.png" alt="" 
                style="max-width: 75px; padding: 20px;">
            <a class="navbar-brand" href="{{ url_for ('dashboard') }}">BSVida - Banco de Sangue</a>
        
            <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="btn btn-outline-secondary">Usuários</span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="{{ url_for ('listagem') }}">Listagem de Usuários</a>
                        <a class="nav-link active" href="{{ url_for ('cadastro') }}">Cadastro de Usuários</a>
                    </li>
                </ul>
            </div>

            <input class="form-control" type="text" nome="txt-pesquisa" 
            placeholder="Pesquisar" style="max-width: 200px;">
            <a href="{{ url_for ('login') }}" class="btn btn-outline-secondary">Sair</a>
        </div>
        
    </nav>

    <main class="navbar shadow-sm" style="justify-content: center; padding: 90px">
        {% block conteudo%}
        <img src="https://raw.githubusercontent.com/ricrett/app-bs/refs/heads/main/static/imgs/3738805.png" alt="" 
        style="max-width: 370px; padding: 100px;">
        {% endblock %}
    </main>

    <footer class="navbar shadow-sm" style="justify-content: space-around; padding: 20px;">
        Projeto desenvolvido por Ricardo Gonçalves Santos Rett
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    {% block scripts %}{% endblock %}

</body>
</html>
