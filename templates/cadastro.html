{% extends 'dashboard.html' %}

{% block titulo %}BSVida - Cadastrar{% endblock %}

{% block conteudo %}

    <div class="card-body" style="max-width: 720px;">
    
        <form action="{{ url_for ('cadastro') }}" method="POST">
            <fieldset class="row g-3">

                <h3>Dados Pessoais</h3>
                <div class="col-md-6">
                    <label for="login" class="form-label fw-semibold">
                        Nome  
                    </label>
                    <input class="form-control" type="text" name="txt-cpf" required>
                </div>    

                <div class="col-md-6">
                    <label for="login" class="form-label fw-semibold">
                        E-mail
                    </label>
                    <input class="form-control" type="text" name="txt-senha" required>
                </div>

                <div class="col-md-6">
                    <label for="login" class="form-label fw-semibold">
                        Celular  
                    </label>
                    <input class="form-control" type="text" name="txt-cpf" placeholder="Somente números" required>
                </div>
                
                <div class="col-md-6">
                    <label for="login" class="form-label fw-semibold">
                        Data de nascimento
                    </label>
                    <input class="form-control" type="date" name="txt-senha" required>
                </div>

                <div class="col-md-6">
                    <label for="login" class="form-label fw-semibold">
                        CPF  
                    </label>
                    <input class="form-control" type="text" name="txt-cpf" placeholder="Somente números" required>
                </div>
                
                <div class="col-md-6">
                    <label for="login" class="form-label fw-semibold">
                        Nível de Acesso:
                    </label>
                    <select name="acesso" id="acesso" class="form-control">
                        <option value="null">(ESCOLHA)</option>
                        <option value="Administrador">Administrador</option>
                        <option value="Usuário">Usuário</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label for="login" class="form-label fw-semibold">
                        CEP
                    </label>
                    <input class="form-control" type="text" name="txt-cpf" placeholder="Somente números" required>
                </div>

                <div class="col-md-6">      
                    <label for="login" class="form-label fw-semibold">
                        Endereço
                    </label>
                    <input class="form-control" type="text" name="txt-senha" required>
                </div>

                <div class="col-md-6">
                    <label for="login" class="form-label fw-semibold">
                        Número  
                    </label>
                    <input class="form-control" type="text" name="txt-cpf" placeholder="Somente números" required>
                </div>
                
                <div class="col-md-6">
                    <label for="login" class="form-label fw-semibold">
                        Complemento
                    </label>
                    <input class="form-control" type="text" name="txt-senha" required>
                </div>

                <div class="col-md-6">
                    <label for="login" class="form-label fw-semibold">
                        Cidade  
                    </label>
                    <input class="form-control" type="text" name="txt-cpf" required>
                </div>

                <div class="col-md-6">
                    <label for="login" class="form-label fw-semibold">
                        Estado
                    </label>
                    <select name="estado" id="estado" class="form-control">
                        <option value="null">(ESCOLHA)</option>
                        <option value="São Paulo">SP</option>
                        <option value="Rio de Janeiro">RJ</option>
                        <option value="Minas Gerais">MG</option>
                        <option value="Paraná">PR</option>
                    </select>
                </div>

                <h3>Histórico de Doações</h3>

                <div class="col-md-6">
                    <label for="login" class="form-label fw-semibold">
                        Última doação
                    </label>
                    <input class="form-control" type="date" name="txt-senha" required>
                </div>

                <div class="col-md-6">
                    <label for="login" class="form-label fw-semibold">
                        Local
                    </label>
                    <input class="form-control" type="text" name="txt-senha" required>
                </div>

                <div class="col-md-6">
                    <label for="login" class="form-label fw-semibold">
                        Doador de Medula
                    </label>
                    <select name="doador" id="doador" class="form-control">
                        <option value="null">(ESCOLHA)</option>
                        <option value="Sim">Sim</option>
                        <option value="Não">Não</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label for="login" class="form-label fw-semibold">
                        Última doação Medula
                    </label>
                    <input class="form-control" type="date" name="txt-senha" required>
                </div>

                <h3>Histórico Médico</h3>

                <div class="col-md-6">
                    <label for="login" class="form-label fw-semibold">
                        Possui alguma doença
                    </label>
                    <input class="form-control" type="text" name="txt-senha" required>
                </div>

                <div class="col-md-6">
                    <label for="login" class="form-label fw-semibold">
                        Realizou procedimento cirúrgico
                    </label>
                    <input class="form-control" type="text" name="txt-senha" required>
                </div>

                <div class="col-md-6">
                    <label for="login" class="form-label fw-semibold">
                        Realizou procedimento estético
                    </label>
                    <input class="form-control" type="text" name="txt-senha" required>
                </div>

                <div class="col-md-6">
                    <label for="login" class="form-label fw-semibold">
                        Sexo
                    </label>
                    <select name="sexo" id="sexo" class="form-control">
                        <option value="null">(ESCOLHA)</option>
                        <option value="Feminino">Feminino</option>
                        <option value="Masculino">Masculino</option>
                    </select>
                </div>
            </fieldset>

            
        </form>

        <div class="d-grid gap-2 d-md-flex justify-content-md-center" style="padding: 30px; margin: 10px auto;">
            <a href="#" class="btn btn-outline-secondary">Salvar</a>
            <a href="{{ url_for ('cadastro') }}" class="btn btn-outline-secondary">Limpar</a>
            <a href="{{ url_for ('dashboard') }}" class="btn btn-outline-secondary">Voltar</a>
        </div>
    </div>    
{% endblock %}
