{% extends 'dashboard.html' %}

{% block titulo %}BSVida - Cadastrar{% endblock %}

{% block conteudo %}

    <div class="card-body" style="max-width: 720px;">
    
        <form action="{{ url_for ('cadastro') }}" method="POST">
            <fieldset class="row g-3">

                <h3>Dados Pessoais</h3>
                <div class="col-md-6">
                    <label for="nome" class="form-label fw-semibold">
                        Nome  
                    </label>
                    <input class="form-control" type="text" id="nome" name="nome" required>
                </div>    

                <div class="col-md-6">
                    <label for="email" class="form-label fw-semibold">
                        E-mail
                    </label>
                    <input class="form-control" type="text" id="email" name="email" required>
                </div>

                <div class="col-md-6">
                    <label for="celular" class="form-label fw-semibold">
                        Celular  
                    </label>
                    <input class="form-control" type="text" id="celular" name="celular" placeholder="Somente números" required>
                </div>
                
                <div class="col-md-6">
                    <label for="nasc" class="form-label fw-semibold">
                        Data de nascimento
                    </label>
                    <input class="form-control" type="date" id="nasc" name="nasc" required>
                </div>

                <div class="col-md-6">
                    <label for="cpf" class="form-label fw-semibold">
                        CPF  
                    </label>
                    <input class="form-control" type="text" id="cpf" name="cpf" placeholder="Somente números" required>
                </div>
                
                <div class="col-md-6">
                    <label for="acesso" class="form-label fw-semibold">
                        Nível de Acesso:
                    </label>
                    <select name="acesso" id="acesso" class="form-control">
                        <option value="null">(ESCOLHA)</option>
                        <option value="Administrador">Administrador</option>
                        <option value="Usuário">Usuário</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label for="cep" class="form-label fw-semibold">
                        CEP
                    </label>
                    <input class="form-control" type="text" id="cep" name="cep" placeholder="Somente números" required>
                </div>

                <div class="col-md-6">      
                    <label for="endereco" class="form-label fw-semibold">
                        Endereço
                    </label>
                    <input class="form-control" type="text" id="endereco" name="endereco" required>
                </div>

                <div class="col-md-6">
                    <label for="numero" class="form-label fw-semibold">
                        Número  
                    </label>
                    <input class="form-control" type="text" id="numero" name="numero" placeholder="Somente números" required>
                </div>
                
                <div class="col-md-6">
                    <label for="complemento" class="form-label fw-semibold">
                        Complemento
                    </label>
                    <input class="form-control" type="text" id="complemento" name="complemento" required>
                </div>

                <div class="col-md-6">
                    <label for="cidade" class="form-label fw-semibold">
                        Cidade  
                    </label>
                    <input class="form-control" type="text" id="cidade" name="cidade" required>
                </div>

                <div class="col-md-6">
                    <label for="estado" class="form-label fw-semibold">
                        Estado
                    </label>
                    <select name="estado" id="estado" class="form-control">
                        <option value="null">(ESCOLHA)</option>
                        <option value="São Paulo">SP</option>
                        <option value="Rio de Janeiro">RJ</option>
                        <option value="Minas Gerais">MG</option>
                        <option value="Paraná">PR</option>
                    </select>
                </div>

                <h3>Histórico de Doações</h3>

                <div class="col-md-6">
                    <label for="doacao" class="form-label fw-semibold">
                        Última doação
                    </label>
                    <input class="form-control" type="date" id="doacao" name="doacao" required>
                </div>

                <div class="col-md-6">
                    <label for="local" class="form-label fw-semibold">
                        Local
                    </label>
                    <input class="form-control" type="text" id="local "name="local" required>
                </div>

                <div class="col-md-6">
                    <label for="fator" class="form-label fw-semibold">
                        Fator RH
                    </label>
                    <select name="fator" id="fator" class="form-control">
                        <option value="null">(ESCOLHA)</option>
                        <option value="Sim">Positivo (+)</option>
                        <option value="Não">Negativo (-)</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label for="tsanguineo" class="form-label fw-semibold">
                        Tipo sanguíneo
                    </label>
                    <select name="tsanguineo" id="tsanguineo" class="form-control">
                        <option value="null">(ESCOLHA)</option>
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="AB">AB</option>
                        <option value="O">O</option>
                    </select>
                </div>

                <h3>Histórico Médico</h3>

                <div class="col-md-6">
                    <label for="doenca" class="form-label fw-semibold">
                        Possui alguma doença
                    </label>
                    <input class="form-control" type="text" id="doenca" name="doenca" required>
                </div>

                <div class="col-md-6">
                    <label for="cirurgia" class="form-label fw-semibold">
                        Realizou procedimento cirúrgico
                    </label>
                    <input class="form-control" type="text" id="cirurgia" name="cirurgia" required>
                </div>

                <div class="col-md-6">
                    <label for="estetico" class="form-label fw-semibold">
                        Realizou procedimento estético
                    </label>
                    <input class="form-control" type="text" id="estetico" name="estetico" required>
                </div>

                <div class="col-md-6">
                    <label for="sexo" class="form-label fw-semibold">
                        Sexo
                    </label>
                    <select name="sexo" id="sexo" class="form-control">
                        <option value="null">(ESCOLHA)</option>
                        <option value="Feminino">Feminino</option>
                        <option value="Masculino">Masculino</option>
                    </select>
                </div>
            </fieldset>

            <div class="d-grid gap-2 d-md-flex justify-content-md-center" style="padding: 30px; margin: 10px auto;">
                <button type="submit" class="btn btn-outline-secondary">Salvar</button>
                <button type="reset" class="btn btn-outline-secondary">Limpar</button>
                <button href="{{ url_for ('dashboard') }}" class="btn btn-outline-secondary">Voltar</button>
            </div>
        </form>

        {% if erros %}
            <div class="mb-4">
                {% for erro in erros %}
                    <div class="alert alert-danger">
                        {{ erro }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}
    </div>    
{% endblock %}
